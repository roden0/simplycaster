[package]
name = "coordinator"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
ts-rs = "12.0.1"
turn = "0.17.2"
uuid = { version = "1.29.2", features = ["v7"] }
webauthn-rs = { version = "0.6.2", features = ["conditional-ui"] }
webauthn-rs-proto = "0.6.2"
webrtc-util = { version = "0.17.2", default-features = false, features = ["vnet"] }
zip = { version = "9.3.0", default-features = false }
