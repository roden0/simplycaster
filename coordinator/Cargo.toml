[package]
name = "coordinator"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
ts-rs = "12.0.1"
turn = "0.17.2"
webrtc-util = { version = "0.17.2", default-features = false, features = ["vnet"] }
zip = { version = "9.3.0", default-features = false }
