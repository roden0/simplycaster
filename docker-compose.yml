# SimplyCaster instance: the Coordinator, HTTPS by Caddy and a daily restic backup of ./data.
# Copy .env.example to .env, fill it in and run `docker compose up -d`. See README.md.

services:
  simplycaster:
    image: ghcr.io/roden0/simplycaster:0.2.0
    restart: unless-stopped
    environment:
      BACKOFFICE_TOKEN: ${BACKOFFICE_TOKEN:?set BACKOFFICE_TOKEN in .env}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_RELAY_PORTS: ${TURN_RELAY_PORTS:-49160-49199}
    volumes:
      - ./data:/data
    ports:
      # Live conversation (STUN/TURN): the same numbers outside, the Coordinator tells browsers these ports.
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_RELAY_PORTS:-49160-49199}:${TURN_RELAY_PORTS:-49160-49199}/udp"

  # HTTPS with an automatic certificate: browsers only record in a secure context.
  # Already have a reverse proxy? Remove this service and publish "127.0.0.1:3000:3000" above.
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to simplycaster:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data

  # Daily, encrypted, deduplicated backup of ./data with restic. By default into ./backups, on this
  # same server; point RESTIC_REPOSITORY at another place (S3, B2, SFTP...) for a real off-site copy.
  backup:
    image: restic/restic:0.19.1
    restart: unless-stopped
    env_file: .env # passes the storage credentials restic needs (AWS_*, B2_*...)
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
    volumes:
      - ./data:/data
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        restic cat config > /dev/null 2>&1 || restic init
        while true; do
          restic backup --host simplycaster /data &&
            restic forget --prune $${BACKUP_KEEP:---keep-daily 7 --keep-weekly 4 --keep-monthly 6}
          sleep $${BACKUP_EVERY_SECONDS:-86400}
        done

volumes:
  caddy:
